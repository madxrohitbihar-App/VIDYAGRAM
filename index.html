<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">

    <title>MADXROHITBIHAR | Portal</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-deep: #05050a;
            --bg-card: rgba(13, 15, 26, 0.85);
            --border-neon: rgba(0, 242, 254, 0.2);
            --border-hover: rgba(0, 242, 254, 0.6);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
            --neon-cyan: #00f2fe;
            --neon-blue: #4facfe;
            --neon-pink: #ff007f;
            --neon-green: #00ff66;
            --accent-gold: #ffd700;
            --gradient-cyber: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            --gradient-btn: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --shadow-neon: 0 0 20px rgba(0, 242, 254, 0.25);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }

        body {
            display: flex;
            justify-content: center;
            background: radial-gradient(circle at 50% -20%, #1a1c3a 0%, var(--bg-deep) 70%);
        }

        /* =========================================
           SPLASH SCREEN
        ========================================== */

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-deep);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        #splash-screen.hide-splash {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-avatar img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            box-shadow: 0 0 40px rgba(0, 242, 254, 0.5);
            animation: cyber-pulse 1.8s infinite ease-in-out;
        }

        @keyframes cyber-pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
            }

            50% {
                transform: scale(1.06);
                box-shadow: 0 0 50px rgba(0, 242, 254, 0.8);
            }
        }

        /* =========================================
           AUTHENTICATION
        ========================================== */

        #authScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 5, 10, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99998;
            padding: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
        }

        .card h2 {
            color: var(--neon-cyan);
            margin-bottom: 10px;
            font-size: 20px;
        }

        .key-input {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--border-neon);
            background: rgba(255,255,255,0.05);
            color: #fff;
            text-align: center;
            margin-bottom: 15px;
            outline: none;
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 1px;
            font-size: 14px;
        }

        .key-input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--shadow-neon);
        }

        .btn {
            padding: 12px;
            border-radius: 12px;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 10px;
            font-size: 13.5px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.2s;
        }

        .btn-get {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-neon);
            color: var(--neon-cyan);
        }

        .btn-verify {
            background: var(--gradient-btn);
        }

        .btn:active {
            transform: scale(0.98);
        }

        #status-msg {
            font-size: 13px;
            margin-top: 10px;
            font-weight: bold;
        }

        /* =========================================
           MAIN CONTAINER & LAYOUT
        ========================================== */

        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 90px;
        }

        .brand-header {
            text-align: center;
            padding: 16px;
            background: rgba(5, 5, 10, 0.9);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-neon);
            position: sticky;
            top: 0;
            z-index: 101;
        }

        .header-search {
            padding: 16px 16px 6px 16px;
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 44px;
            background: var(--bg-card);
            border: 1px solid var(--border-neon);
            border-radius: 14px;
            color: #fff;
            font-size: 13.5px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: var(--neon-cyan);
            box-shadow: var(--shadow-neon);
        }

        .search-box i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--neon-cyan);
            font-size: 15px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            margin: 16px 16px 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .title-with-dot {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--neon-green);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--neon-green), 0 0 12px var(--neon-green);
            animation: dot-blink 1.2s infinite ease-in-out;
            display: inline-block;
        }

        @keyframes dot-blink {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.4;
                transform: scale(0.8);
            }
        }

        .app-list {
            padding: 0 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .hidden {
            display: none !important;
        }

        .app-card {
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-neon);
            border-radius: 16px;
            padding: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.25s ease;
        }

        .app-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.12);
        }

        .app-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
            overflow: hidden;
        }

        .app-icon {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            object-fit: cover;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        .app-details {
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .app-name {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: normal;
            word-break: break-word;
            line-height: 1.3;
        }

        .app-tag {
            font-size: 11px;
            color: var(--neon-green);
            margin-top: 3px;
            font-weight: 600;
        }

        .app-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .fav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-neon);
            color: var(--text-secondary);
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .fav-btn.active {
            color: var(--neon-pink);
            border-color: var(--neon-pink);
            background: rgba(255, 0, 127, 0.1);
        }

        .open-btn {
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: var(--neon-cyan);
            padding: 9px 18px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 12.5px;
            font-weight: 700;
            transition: all 0.2s;
        }

        .open-btn:hover {
            background: var(--gradient-btn);
            color: #fff;
            border-color: transparent;
            box-shadow: var(--shadow-neon);
        }

        .no-data {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 30px;
        }

        /* =========================================
           BOTTOM NAVIGATION BAR
        ========================================== */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: rgba(5, 5, 10, 0.92);
            backdrop-filter: blur(15px);
            border-top: 1px solid var(--border-neon);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            padding: 6px 16px;
            border-radius: 12px;
            transition: all 0.2s;
        }

        .nav-item i {
            font-size: 16px;
        }

        .nav-item.active {
            color: var(--neon-cyan);
            background: rgba(0, 242, 254, 0.08);
        }

        /* =========================================
           COMMUNITY MODAL & TOAST
        ========================================== */

        #popupModal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            padding: 20px;
        }

        .modal-card {
            background: #0d0f1a;
            border: 1px solid var(--border-neon);
            border-radius: 24px;
            padding: 24px 20px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
        }

        .modal-close-corner {
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border-neon);
            color: #fff;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
        }

        .modal-logo {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--neon-cyan);
            margin-bottom: 14px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .modal-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-social {
            padding: 12px;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-telegram {
            background: linear-gradient(135deg, #0088cc 0%, #00a2ff 100%);
        }

        .btn-whatsapp {
            background: linear-gradient(135deg, #25d366 0%, #1ebe5d 100%);
        }

        .btn-close-main {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-neon);
            color: var(--text-secondary);
        }

        #toast {
            position: fixed;
            bottom: 85px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: rgba(13, 15, 26, 0.95);
            border: 1px solid var(--neon-cyan);
            color: #fff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: var(--shadow-neon);
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
            z-index: 999999;
            pointer-events: none;
        }

        #toast.show {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>

<body>

    <!-- SPLASH SCREEN -->
    <div id="splash-screen">
        <div class="splash-avatar">
            <img src="https://i.postimg.cc/xdvmqvSS/image-search-1788852293975.png" alt="Logo">
        </div>
    </div>

    <!-- DEVICE VERIFICATION -->
    <div id="authScreen" style="display: none;">
        <div class="card">
            <h2>Device Verification</h2>
            <p style="color:var(--text-secondary); font-size:13px; margin-bottom:20px;">
                Please enter your access key obtained from Get Key to unlock the portal (24 Hours Validity).
            </p>
            <input type="text" id="accessKeyInput" class="key-input" placeholder="ENTER KEY">
            <button class="btn btn-get" onclick="openAroLinks()">
                <i class="fa-solid fa-key"></i> Get Key
            </button>
            <button class="btn btn-verify" onclick="verifyUserKey()">
                <i class="fa-solid fa-unlock"></i> Verify & Open Portal
            </button>
            <div id="status-msg"></div>
        </div>
    </div>

    <!-- COMMUNITY MODAL -->
    <div id="popupModal">
        <div class="modal-card">
            <div class="modal-close-corner" onclick="closePopup()">✕</div>
            <img src="https://i.postimg.cc/xdvmqvSS/image-search-1788852293975.png" class="modal-logo" alt="Logo">
            <p class="modal-text">
                Get instant access to free batches, test series and study updates.
            </p>
            <div class="modal-buttons">
                <a href="https://t.me/Study_group_App" target="_blank" class="btn-social btn-telegram">
                    <i class="fa-brands fa-telegram"></i> Telegram Channel
                </a>
                <a href="https://whatsapp.com/channel/0029Vb6FhReEquiLz1jNH00o" target="_blank" class="btn-social btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> WhatsApp Channel
                </a>
                <button class="btn-social btn-close-main" onclick="closePopup()">Continue</button>
            </div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div id="toast">Notification</div>

    <!-- MAIN APP -->
    <div class="app-container">
        <div class="brand-header"></div>

        <div class="header-search">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Search apps..." onkeyup="filterApps()">
            </div>
        </div>

        <div class="section-title">
            <div class="title-with-dot">
                <span class="live-dot" id="live-dot-indicator"></span>
                <span id="section-label">All Active App</span>
            </div>
            <span id="header-count" style="color: var(--neon-cyan);">0 Available</span>
        </div>

        <!-- ACTIVE APPS TAB -->
        <div class="app-list" id="tab-active"></div>

        <!-- UPCOMING APPS TAB -->
        <div class="app-list hidden" id="tab-upcoming"></div>

        <!-- FAVORITES TAB -->
        <div class="app-list hidden" id="tab-favorites"></div>

        <!-- BOTTOM NAVIGATION -->
        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-active" onclick="switchTab('active', this)">
                <i class="fa-solid fa-layer-group"></i>
                <span>Active</span>
            </button>
            <button class="nav-item" id="nav-upcoming" onclick="switchTab('upcoming', this)">
                <i class="fa-solid fa-clock"></i>
                <span>Upcoming</span>
            </button>
            <button class="nav-item" id="nav-favorites" onclick="switchTab('favorites', this)">
                <i class="fa-solid fa-heart"></i>
                <span>Favorites</span>
            </button>
        </nav>
    </div>

    <!-- JAVASCRIPT -->
    <script>
        // Data Source Definition
        const activeApps = [
            { id: 21, name: "Vidyagram", img: "https://i.postimg.cc/PqbrQWnH/image-search-1791123215735.png", link: "https://madxrohitbihar-app.github.io/Vidyagram-pro/" },
            { id: 72, name: "Physics Wallah", img: "https://i.postimg.cc/ZRMVR91P/image-search-1791519463252.webp", link: "https://vidcloud.eu.org/#batches" },
            { id: 2, name: "Khan Global Studies", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTuCiwfy76ica73byqKIURXqN2Zi2h2Sdw0VJooGkXsyg&s", link: "https://www.study-mate.in/batches" },
            { id: 18, name: "Physics Pi", img: "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1plcMrWwVtz1_zK8I6kbPtktbGikeJ55Ukuaad408XQ&s", link: "https://pi.studyspark.study/" }
        ];

        // Empty Array as requested
        const upcomingApps = [];

        let favorites = JSON.parse(localStorage.getItem('userFavs')) || [];
        let currentTab = 'active';

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function renderApps() {
            // Render Active Apps
            const activeContainer = document.getElementById('tab-active');
            activeContainer.innerHTML = activeApps.map(app => `
                <div class="app-card" data-name="${app.name.toLowerCase()}">
                    <div class="app-info">
                        <img src="${app.img}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/48/0d1424/fff?text=App'">
                        <div class="app-details">
                            <span class="app-name">${app.name}</span>
                            <span class="app-tag">Server Active</span>
                        </div>
                    </div>
                    <div class="app-actions">
                        <button class="fav-btn ${favorites.includes(app.id) ? 'active' : ''}" onclick="toggleFavorite(${app.id})">
                            <i class="fa-${favorites.includes(app.id) ? 'solid' : 'regular'} fa-heart"></i>
                        </button>
                        <a href="${app.link}" class="open-btn" target="_blank">Open</a>
                    </div>
                </div>
            `).join('');

            // Render Upcoming Apps
            const upcomingContainer = document.getElementById('tab-upcoming');
            if (upcomingApps.length === 0) {
                upcomingContainer.innerHTML = `<div class="no-data">No upcoming apps at the moment.</div>`;
            } else {
                upcomingContainer.innerHTML = upcomingApps.map(app => `
                    <div class="app-card" data-name="${app.name.toLowerCase()}">
                        <div class="app-info">
                            <img src="${app.img}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/48/0d1424/fff?text=App'">
                            <div class="app-details">
                                <span class="app-name">${app.name}</span>
                                <span class="app-tag" style="color: var(--neon-cyan);">Coming Soon</span>
                            </div>
                        </div>
                        <div class="app-actions">
                            <button class="fav-btn ${favorites.includes(app.id) ? 'active' : ''}" onclick="toggleFavorite(${app.id})">
                                <i class="fa-${favorites.includes(app.id) ? 'solid' : 'regular'} fa-heart"></i>
                            </button>
                            <a href="${app.link}" class="open-btn" target="_blank">Open</a>
                        </div>
                    </div>
                `).join('');
            }

            // Render Favorites Tab
            const favContainer = document.getElementById('tab-favorites');
            const allApps = activeApps.concat(upcomingApps);
            const favApps = allApps.filter(app => favorites.includes(app.id));

            if (favApps.length === 0) {
                favContainer.innerHTML = `<div class="no-data">No favorite apps saved yet.</div>`;
            } else {
                favContainer.innerHTML = favApps.map(app => `
                    <div class="app-card" data-name="${app.name.toLowerCase()}">
                        <div class="app-info">
                            <img src="${app.img}" class="app-icon" alt="${app.name}" onerror="this.src='https://via.placeholder.com/48/0d1424/fff?text=App'">
                            <div class="app-details">
                                <span class="app-name">${app.name}</span>
                                <span class="app-tag" style="color: var(--neon-pink);">Saved Item</span>
                            </div>
                        </div>
                        <div class="app-actions">
                            <button class="fav-btn active" onclick="toggleFavorite(${app.id})">
                                <i class="fa-solid fa-heart"></i>
                            </button>
                            <a href="${app.link}" class="open-btn" target="_blank">Open</a>
                        </div>
                    </div>
                `).join('');
            }

            updateCounts();
            filterApps();
        }

        function updateCounts() {
            const countEl = document.getElementById('header-count');
            if (currentTab === 'active') {
                countEl.innerText = `${activeApps.length} Available`;
            } else if (currentTab === 'upcoming') {
                countEl.innerText = `${upcomingApps.length} Coming Soon`;
            } else {
                const allApps = activeApps.concat(upcomingApps);
                const favCount = allApps.filter(app => favorites.includes(app.id)).length;
                countEl.innerText = `${favCount} Saved`;
            }
        }

        function toggleFavorite(id) {
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
                showToast("Removed from Favorites");
            } else {
                favorites.push(id);
                showToast("Added to Favorites");
            }
            localStorage.setItem('userFavs', JSON.stringify(favorites));
            renderApps();
        }

        function switchTab(tabName, element) {
            currentTab = tabName;
            document.querySelectorAll('.bottom-nav .nav-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');

            ['active', 'upcoming', 'favorites'].forEach(tab => {
                document.getElementById(`tab-${tab}`).classList.add('hidden');
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            const sectionLabel = document.getElementById('section-label');
            const liveDot = document.getElementById('live-dot-indicator');

            if (tabName === 'active') {
                sectionLabel.innerText = "All Active App";
                liveDot.style.display = "inline-block";
            } else if (tabName === 'upcoming') {
                sectionLabel.innerText = "Upcoming Apps";
                liveDot.style.display = "none";
            } else {
                sectionLabel.innerText = "Favorite Apps";
                liveDot.style.display = "none";
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
            document.getElementById('searchInput').value = '';
            renderApps();
        }

        function filterApps() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const currentTabEl = document.getElementById(`tab-${currentTab}`);
            currentTabEl.querySelectorAll('.app-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = (!name || name.includes(query)) ? 'flex' : 'none';
            });
        }

        /* =========================================
           AUTHENTICATION CHECK
        ========================================== */

        function checkAuthStatus() {
            const expiryTime = localStorage.getItem("app_expiry_time");
            const authScreen = document.getElementById("authScreen");
            if (!authScreen) return;
            const now = Date.now();
            if (expiryTime && now < parseInt(expiryTime, 10)) {
                authScreen.style.display = "none";
            } else {
                authScreen.style.display = "flex";
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            checkAuthStatus();
            renderApps();
        });

        window.addEventListener("pageshow", function () {
            checkAuthStatus();
        });

        document.addEventListener("visibilitychange", function () {
            if (!document.hidden) {
                checkAuthStatus();
            }
        });

        /* =========================================
           GENERATE SECRET KEY & AROLINKS
        ========================================== */

        function generateSecretKey() {
            const chars = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            let middlePart = "";
            for (let i = 0; i < 14; i++) {
                middlePart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return "MAD" + middlePart + "APP";
        }

        function openAroLinks() {
            const apiToken = "828c34db80ec53e94e7174f5f52e0b274a38ab2d";
            const freshKey = generateSecretKey();
            localStorage.setItem("expected_app_key", freshKey);

            const targetUrl = "https://madxrohitbihar-app.github.io/VIDYAGRAM-KYE/?key=" + encodeURIComponent(freshKey);
            const apiUrl = `https://arolinks.com/api?api=${apiToken}&url=${encodeURIComponent(targetUrl)}`;

            const msgDiv = document.getElementById("status-msg");
            msgDiv.style.color = "#00f2fe";
            msgDiv.innerText = "Generating Token...";

            fetch(apiUrl)
                .then(function (response) { return response.json(); })
                .then(function (data) {
                    if (data.status === "success" && data.shortenedUrl) {
                        window.location.href = data.shortenedUrl;
                    } else {
                        msgDiv.style.color = "#ff4d4d";
                        msgDiv.innerText = "Error generating link!";
                    }
                })
                .catch(function () {
                    msgDiv.style.color = "#ff4d4d";
                    msgDiv.innerText = "Network Error!";
                });
        }

        function verifyUserKey() {
            const userKey = document.getElementById("accessKeyInput").value.trim().toUpperCase();
            const expectedKey = localStorage.getItem("expected_app_key");
            const usedKeys = JSON.parse(localStorage.getItem("used_app_keys") || "[]");
            const msgDiv = document.getElementById("status-msg");

            if (!userKey) {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Please enter access key!";
                return;
            }

            const patternValid = userKey.startsWith("MAD") && userKey.endsWith("APP") && userKey.length === 20;

            if (!patternValid) {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Invalid token format!";
                return;
            }

            if (usedKeys.includes(userKey)) {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "This token has already been used! Please generate a new key.";
                return;
            }

            if ((expectedKey && userKey === expectedKey) || patternValid) {
                usedKeys.push(userKey);
                localStorage.setItem("used_app_keys", JSON.stringify(usedKeys));

                const twentyFourHours = 24 * 60 * 60 * 1000;
                const expiryTimestamp = Date.now() + twentyFourHours;
                localStorage.setItem("app_expiry_time", expiryTimestamp);

                document.getElementById("authScreen").style.display = "none";

                if (window.history && window.history.replaceState) {
                    const cleanUrl = window.location.origin + window.location.pathname;
                    window.history.replaceState({ path: cleanUrl }, "", cleanUrl);
                }
            } else {
                msgDiv.style.color = "#ff4d4d";
                msgDiv.innerText = "Invalid Access Token!";
            }
        }

        /* =========================================
           SPLASH + POPUP + URL KEY
        ========================================== */

        document.addEventListener("DOMContentLoaded", function () {
            const splash = document.getElementById("splash-screen");

            if (!sessionStorage.getItem("splashShown")) {
                setTimeout(function () {
                    splash.classList.add("hide-splash");
                    sessionStorage.setItem("splashShown", "true");
                }, 1200);
            } else {
                splash.style.display = "none";
            }

            const urlParams = new URLSearchParams(window.location.search);
            const urlKey = urlParams.get("key");

            if (urlKey) {
                document.getElementById("accessKeyInput").value = urlKey;
                localStorage.setItem("expected_app_key", urlKey);
            }

            if (!sessionStorage.getItem("popupShown")) {
                setTimeout(function () {
                    document.getElementById("popupModal").style.display = "flex";
                }, 2000);
            }

            checkAuthStatus();
        });

        function closePopup() {
            document.getElementById("popupModal").style.display = "none";
            sessionStorage.setItem("popupShown", "true");
        }
    </script>

</body>

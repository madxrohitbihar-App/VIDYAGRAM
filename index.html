<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Update Available - ModEduZone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .update-card {
            background: #111827;
            border: 2px solid #ff9900;
            box-shadow: 0 0 25px rgba(255, 153, 0, 0.4);
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .badge {
            background: rgba(255, 153, 0, 0.15);
            color: #ff9900;
            font-size: 12px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 153, 0, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #ffaa00;
        }

        p {
            font-size: 14px;
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .features-list {
            text-align: left;
            background: #1f2937;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            border-left: 4px solid #ff9900;
        }

        .features-list li {
            font-size: 13px;
            color: #e2e8f0;
            margin-bottom: 8px;
            list-style: none;
            display: flex;
            align-items: center;
        }

        .features-list li:last-child {
            margin-bottom: 0;
        }

        .features-list li::before {
            content: "⚡";
            margin-right: 8px;
            color: #ffaa00;
        }

        .btn {
            display: block;
            width: 100%;
            background: linear-gradient(135deg, #ff9900, #ff5500);
            color: #ffffff;
            font-weight: 700;
            font-size: 15px;
            padding: 14px;
            border-radius: 10px;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(255, 153, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .watermark {
            margin-top: 20px;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="update-card">
        <span class="badge">New Update Available</span>
        <h1>VIDYAGRAM APP </h1>
        <p>Purani app me aa rahi problems ko fix karke naya aur stable version release kar diya gaya hai.</p>
        
        <ul class="features-list">
            <li>30+ New Institutes Added</li>
            <li>All Bugs & Crash Fixed</li>
            <li>Smooth & Fast Performance</li>
        </ul>

        <a href="https://t.me/Study_group_App" class="btn" target="_blank">Join Telegram & Get New App</a>

        <div class="watermark">MADXROHITBIHAR • ModEduZone</div>
    </div>

</body>
</html>
